# =============================================================================
# Module Workflow: Directory Scanning
# =============================================================================

kind: module
name: do-scan-content
description: Bruteforce directories and files on a single target with Vigolium (stateless retry as fallback)
tags: directory, bruteforce, content-discovery, vigolium

# -----------------------------------------------------------------------------
# PARAMS SECTION
# -----------------------------------------------------------------------------
params:
  - name: httpFile
    default: "{{Output}}/probing/http-{{TargetSpace}}.txt"

  - name: dirbLimit
    default: "100000"

  # speed tuning params
  - name: deparosMaxtime
    default: "30m"
  - name: deparosParallel
    default: "10"
  - name: deparosThreads
    default: "40"
  - name: deparosMaxPerHost
    default: "40"
  # must exceed deparosMaxtime (see spitolasTimeout note): equal values guarantee exit 124
  - name: deparosTimeout
    default: "35m"


  - name: defaultUA
    default: "User-Agent: Mozilla/5.0 (compatible; Osmedeus/v5; +https://github.com/j3ssie/osmedeus)"
  - name: vigoliumDefaultUA
    default: "User-Agent: Mozilla/5.0 (compatible; Vigolium OSS +https://github.com/vigolium/vigolium)"


  # shared vigolium database that every target in the foreach accumulates into
  - name: deparosDBDir
    default: "{{Output}}/content-discovery/deparos-dbs"
  - name: deparosDBFile
    default: "{{Output}}/content-discovery/deparos-dbs/vgnm_{{TargetSpace}}.sqlite"

  # output reports (a single vigolium export turns the shared db into the HTML report + raw JSONL)
  - name: deparosHTMLReport
    default: "{{Output}}/content-discovery/deparos-{{TargetSpace}}.html"
  # raw JSONL exported by vigolium (each record is wrapped as {"type":"http_record","data":{...}})
  - name: contentDiscoveryRawJsonlFile
    default: "{{Output}}/content-discovery/deparos-{{TargetSpace}}.jsonl"
  # normalized/flattened records consumed by the markdown + db steps
  - name: contentDiscoveryJsonlFile
    default: "{{Output}}/content-discovery/deparos-records-{{TargetSpace}}.jsonl"
  - name: contentDiscoveryCleanJsonlFile
    default: "{{Output}}/content-discovery/deparos-clean-{{TargetSpace}}.jsonl"
  - name: contentDiscoverMarkdownFile
    default: "{{Output}}/content-discovery/content-discovery-report-{{TargetSpace}}.md"

  # for doing http fingerprinting on discovered urls
  - name: httpThreads
    default: "{{ threads * 2 }}"
  - name: httpTimeout
    default: "15"
  - name: contentDiscoverUrlsFile
    default: "{{Output}}/content-discovery/content-discovery-url-{{TargetSpace}}.txt"
  - name: httpFingerprintJsonFile
    default: "{{Output}}/content-discovery/content-fingerprint-{{TargetSpace}}.jsonl"
  - name: httpInterestingFilteredJsonFile
    default: "{{Output}}/content-discovery/content-fingerprint-filtered-{{TargetSpace}}.jsonl"

  # wordlists
  # A host that answers every path with the same status+length is a catch-all; more than
  # this many identical host+status+length responses are dropped as noise, not content.
  - name: catchAllThreshold
    default: "5"

  - name: contentDiscoverWordlist
    default: "{{Data}}/wordlists/content/small.txt"


# -----------------------------------------------------------------------------
# DEPENDENCIES SECTION
# -----------------------------------------------------------------------------
dependencies:
  commands:
    - vigolium
    - jq

# -----------------------------------------------------------------------------
# REPORTS SECTION
# -----------------------------------------------------------------------------
reports:
  - name: beautify-content-discovery-results
    path: "{{deparosHTMLReport}}"
    type: html
    description: Beautified content discovery results

  - name: content-discovery-markdown-report
    path: "{{contentDiscoverMarkdownFile}}"
    type: md
    description: Markdown report of interesting content discovery results

# -----------------------------------------------------------------------------
# STEPS SECTION
# -----------------------------------------------------------------------------
steps:
  # ---------------------------------------------------------------------------
  # Setup: Create output folder
  # ---------------------------------------------------------------------------
  - name: create-output-folder
    type: function
    log: "Creating content-discovery output folder"
    functions:
      - 'create_folder("{{Output}}/content-discovery")'
      - 'create_folder("{{deparosDBDir}}")'

  # ---------------------------------------------------------------------------
  # Directory bruteforce with vigolium
  # ---------------------------------------------------------------------------
  - name: advanced-directory-bruteforce
    type: foreach
    log: "Running advanced directory bruteforce with vigolium"
    pre_condition: 'file_exists("{{httpFile}}")'
    input: "{{httpFile}}"
    variable: line # this is the variable name for each line in the input file [[line]]
    threads: "{{deparosParallel}}"
    step:
      name: vigolium-single-target
      type: bash
      command: "timeout -k 1m {{deparosTimeout}} vigolium scan --only discover --db-isolate --soft-fail --silent -H \"{{vigoliumDefaultUA}}\" --omit-response --db {{deparosDBFile}} --concurrency {{deparosThreads}} --max-per-host {{deparosMaxPerHost}} --discover-max-time {{deparosMaxtime}} --scanning-max-duration {{deparosMaxtime}} --discovery-wordlist {{contentDiscoverWordlist}} -t '[[line]]'"
      # with custom wordlists
    on_error:
      - action: continue # keep discovering on the remaining targets if one fails

  - name: "generate-deparos-reports"
    type: bash
    log: "Generate vigolium HTML report and JSONL export from the shared db"
    pre_condition: 'file_exists("{{deparosDBFile}}")'
    commands:
      # -S reads the standalone db without writing to it; --exclude takes singular
      # record-type names (module/finding/scan) and is the filter that actually works
      - "vigolium export -S --silent --db {{deparosDBFile}} --exclude module,finding,scan --omit-response --format html -o {{deparosHTMLReport}}"
      - "vigolium export -S --silent --db {{deparosDBFile}} --exclude module,finding,scan --omit-response --format jsonl -o {{contentDiscoveryRawJsonlFile}}"
      # just to save space, remove the vigolium db after report generation
      # - "rm -rf {{deparosDBFile}}"

  - name: "normalize-deparos-records"
    type: bash
    log: "Normalizing vigolium content-discovery records into the flat schema"
    pre_condition: 'file_exists("{{contentDiscoveryRawJsonlFile}}")'
    commands:
      # flatten the nested vigolium http_record objects into the flat fields the markdown/db steps expect,
      # then drop catch-all noise: a host answering >catchAllThreshold paths with an identical
      # status+content_length is a wildcard responder, not content discovery (netflix hosts that
      # 301 every path produced 25 of 27 records this way)
      # one slurped pass: the second jq already slurped, so merging costs no extra memory.
      # `add` concatenates the kept groups; `flatten` would recurse into any future
      # array-valued field. `// []` keeps an all-noise input from erroring on null.
      - "jq -c -s 'map(select(.type==\"http_record\") | .data | {url, status_code, title: .response_title, words: .response_words, content_length: .response_content_length, content_type: .response_content_type}) | group_by([(.url | split(\"/\")[2]), .status_code, .content_length]) | map(select(length <= {{catchAllThreshold}})) | add // [] | .[]' {{contentDiscoveryRawJsonlFile}} > {{contentDiscoveryJsonlFile}}"

  - name: deparos-beautify-interesting-content-results
    type: function
    log: "Beautifying interesting content results"
    pre_condition: 'file_exists("{{contentDiscoveryJsonlFile}}")'
    functions:
      - jsonl_filter("{{contentDiscoveryJsonlFile}}", "{{contentDiscoveryCleanJsonlFile}}", "url,status_code,title,words,content_length,content_type")
      - sort_unix("{{contentDiscoveryCleanJsonlFile}}")
      - convert_jsonl_to_markdown("{{contentDiscoveryCleanJsonlFile}}", "{{contentDiscoverMarkdownFile}}")


  - name: process-dirb-data-in-db
    type: function
    log: "Processing dirb-data in db"
    pre_condition: 'file_exists("{{contentDiscoveryJsonlFile}}")'
    functions:
      - 'db_total_content("{{contentDiscoveryJsonlFile}}")'
      - 'db_import_custom_asset("{{TargetSpace}}", "{{contentDiscoveryJsonlFile}}", "content-discovery", "deparos")'
      - 'send_telegram_file("{{deparosHTMLReport}}", "HTML Content Discovery Results")'
    on_error:
      - action: continue # in case of error, continue the workflow


  ### Fallback: a stateless vigolium discovery retry, only when the primary produced nothing.
  ### Deliberately NOT the same command as the primary: it skips the shared sqlite db
  ### entirely (--stateless, per-target jsonl), so it survives the db being the failure.
  - name: directory-bruteforce-stateless-retry
    type: foreach
    log: "Retrying content discovery with vigolium (stateless, no shared db)"
    pre_condition: 'file_exists("{{httpFile}}") && file_length("{{contentDiscoveryJsonlFile}}") < 1'
    input: "{{httpFile}}"
    variable: line
    threads: "{{deparosParallel}}"
    step:
      name: vigolium-stateless-single-target
      type: bash
      command: "timeout -k 1m {{deparosTimeout}} vigolium scan --only discover --stateless --soft-fail --silent -H \"{{vigoliumDefaultUA}}\" --omit-response --concurrency {{deparosThreads}} --max-per-host {{deparosMaxPerHost}} --discover-max-time {{deparosMaxtime}} --scanning-max-duration {{deparosMaxtime}} --discovery-wordlist {{contentDiscoverWordlist}} --format jsonl -o {{Output}}/content-discovery/stateless-raw-[[_id_]].jsonl --target '[[line]]'"
    on_error:
      - action: continue # keep discovering on the remaining targets if one fails

  # ---------------------------------------------------------------------------
  # Process the stateless retry output
  # ---------------------------------------------------------------------------
  - name: process-stateless-retry-results
    type: function
    log: "Processing stateless vigolium discovery results"
    # fires whenever the primary produced nothing, so it also covers a retry that found nothing
    pre_condition: 'file_length("{{contentDiscoveryJsonlFile}}") < 1'
    functions:
      - exec_cmd("cat {{Output}}/content-discovery/stateless-raw-*.jsonl | jq -r 'select(.type == \"http_record\") | .data.url // empty' > {{contentDiscoverUrlsFile}} 2>/dev/null")
      - exec_cmd("rm -rf {{Output}}/content-discovery/stateless-raw-*.jsonl")
      - sort_unix("{{contentDiscoverUrlsFile}}")
    on_error:
      - action: continue # the retry may legitimately have found nothing

  # ---------------------------------------------------------------------------
  # HTTP fingerprinting with pd-httpx
  # ---------------------------------------------------------------------------
  - name: http-fingerprint-on-discovered-urls
    type: bash
    log: "Fingerprinting discovered URLs with pd-httpx"
    pre_condition: 'file_exists("{{contentDiscoverUrlsFile}}")'
    commands:
      - 'cat {{contentDiscoverUrlsFile}} | pd-httpx -H "{{defaultUA}}" -timeout {{httpTimeout}} -t {{httpThreads}} -no-fallback -no-color -silent -json -title -favicon -hash sha256 -jarm -tech-detect -status-code -cdn -tls-grab -ztls -vhost -follow-host-redirects -include-chain >> {{httpFingerprintJsonFile}}'
  - name: process-content-discovery-fingerprint-in-db
    type: function
    log: "Processing content discovery fingerprint in db"
    pre_condition: 'file_exists("{{httpFingerprintJsonFile}}")'
    functions:
      - jsonl_filter("{{httpFingerprintJsonFile}}", "{{httpInterestingFilteredJsonFile}}", "url,title,status_code,content_length,lines,webserver,tech,cdn")
      - 'db_total_urls("{{httpInterestingFilteredJsonFile}}")'
      - 'db_total_assets("{{httpInterestingFilteredJsonFile}}")'
      - 'db_import_asset_from_file("{{TargetSpace}}", "{{httpInterestingFilteredJsonFile}}")'
    on_error:
      - action: continue # in case of error, continue the workflow
